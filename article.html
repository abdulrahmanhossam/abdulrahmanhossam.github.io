<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Article - Abdulrahman Hossam | Software Engineer">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23FFD700' width='100' height='100' rx='0'/><rect fill='%23000' x='3' y='3' width='94' height='94' rx='0'/><text x='50' y='68' font-family='monospace' font-size='40' font-weight='bold' fill='%23FFD700' text-anchor='middle'>AH</text></svg>"
        type="image/svg+xml">
    <title>Article - Abdulrahman Hossam</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">

    <style>
        :root {
            --bg: #FFF8E7;
            --card-bg: #fff;
            --text: #1a1a1a;
            --text-muted: #4a4a4a;
            --border: #000000;
            --shadow: #000000;
            --yellow: #FFD700;
            --pink: #FF6B9D;
            --blue: #4DAAFC;
            --green: #A3F75A;
            --purple: #C4A1FF;
            --orange: #FFB347;
            --border-w: 3px;
            --shadow-sm: 4px 4px 0px var(--shadow);
            --shadow-md: 6px 6px 0px var(--shadow);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Flag Banner */
        .flag-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            display: flex;
            z-index: 100;
        }

        .flag-banner div {
            flex: 1;
        }

        /* Navigation */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-top: 1rem;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-avatar {
            width: 52px;
            height: 52px;
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            background: var(--yellow);
            flex-shrink: 0;
        }

        .nav-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-info h1 {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .nav-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .nav-links {
            display: flex;
            gap: 0.75rem;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 700;
            border: var(--border-w) solid var(--border);
            background: #fff;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .nav-link:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--shadow);
        }

        .nav-link:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 700;
            padding: 0.4rem 0.8rem;
            border: 2px solid var(--border);
            background: #fff;
            box-shadow: 3px 3px 0px var(--shadow);
            margin-bottom: 2.5rem;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .back-link:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--shadow);
        }

        /* Article Content - Prose Styling */
        .article-content {
            border: var(--border-w) solid var(--border);
            background: #fff;
            box-shadow: var(--shadow-md);
            padding: 2.5rem;
        }

        .article-content h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            border-bottom: 4px solid var(--border);
            padding-bottom: 1rem;
        }

        .article-content h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-left: 0.75rem;
            border-left: 5px solid var(--yellow);
        }

        .article-content h3 {
            font-size: 1.2rem;
            font-weight: 800;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        .article-content p {
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
        }

        .article-content strong {
            color: var(--text);
            font-weight: 700;
        }

        .article-content a {
            color: var(--text);
            font-weight: 700;
            border-bottom: 3px solid var(--yellow);
            transition: background 0.15s;
        }

        .article-content a:hover {
            background: var(--yellow);
        }

        .article-content ul,
        .article-content ol {
            margin-bottom: 1.25rem;
            padding-left: 1.5rem;
        }

        .article-content li {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .article-content pre {
            background: var(--text) !important;
            color: #e4e4e7;
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 1.25rem;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.65;
            margin-bottom: 1.5rem;
            margin-top: 0.5rem;
        }

        .article-content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            background: var(--yellow);
            padding: 0.15em 0.4em;
            border: 2px solid var(--border);
            font-weight: 500;
        }

        .article-content pre code {
            background: none;
            border: none;
            padding: 0;
        }

        .article-content blockquote {
            border-left: 5px solid var(--blue);
            background: #f0f8ff;
            border-top: var(--border-w) solid var(--border);
            border-right: var(--border-w) solid var(--border);
            border-bottom: var(--border-w) solid var(--border);
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            font-style: italic;
        }

        .article-content blockquote p {
            margin-bottom: 0;
        }

        .article-content img {
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-sm);
            max-width: 100%;
            height: auto;
            margin: 1.5rem 0;
        }

        .article-content hr {
            border: none;
            border-top: 3px dashed var(--border);
            margin: 2rem 0;
        }

        .article-content table {
            width: 100%;
            border-collapse: collapse;
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .article-content th {
            background: var(--yellow);
            border: 2px solid var(--border);
            padding: 0.65rem 0.85rem;
            font-weight: 800;
            text-align: left;
            font-size: 0.85rem;
        }

        .article-content td {
            border: 2px solid var(--border);
            padding: 0.65rem 0.85rem;
            font-size: 0.9rem;
        }

        /* Loading state */
        .loading-text {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 2rem;
            text-align: center;
        }

        /* Solidarity */
        .solidarity {
            border: var(--border-w) solid var(--border);
            padding: 2rem;
            text-align: center;
            background: #fff;
            box-shadow: var(--shadow-md);
            margin-top: 4rem;
            margin-bottom: 3rem;
        }

        .solidarity h3 {
            font-weight: 900;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .solidarity p {
            font-size: 0.75rem;
            color: var(--text-muted);
            max-width: 28rem;
            margin: 0 auto;
            line-height: 1.6;
        }



        /* Focus */
        a:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 2px;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .nav {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .nav-links {
                gap: 0.4rem;
            }

            .nav-link {
                padding: 0.4rem 0.7rem;
                font-size: 0.75rem;
            }

            .article-content {
                padding: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <!-- Flag Banner -->
    <div class="flag-banner" role="banner">
        <div style="background:#000"></div>
        <div style="background:#fff"></div>
        <div style="background:#009736"></div>
        <div style="background:#ed2c25"></div>
    </div>

    <main style="max-width: 700px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem;" role="main">
        <!-- Navigation -->
        <header>
            <nav class="nav" role="navigation" aria-label="Main navigation">
                <div class="nav-left">
                    <div class="nav-avatar">
                        <img src="images/prt.jpg" alt="Abdulrahman Hossam">
                    </div>
                    <div class="nav-info">
                        <h1>Abdulrahman Hossam</h1>
                        <p>Software Engineer</p>
                    </div>
                </div>
                <div class="nav-links">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="blog.html" class="nav-link">Blog</a>
                    <a href="https://github.com/abdulrahmanhossam" target="_blank" rel="noopener noreferrer"
                        class="nav-link">GitHub</a>
                </div>
            </nav>
        </header>

        <!-- Back -->
        <a href="blog.html" class="back-link">← Back to blog</a>

        <!-- Article Content -->
        <article id="content" class="article-content">
            <p class="loading-text">Loading article...</p>
        </article>

        <!-- Solidarity -->
        <div class="solidarity">
            <h3>Standing with Palestine <span style="font-size: 1.15rem;">🇵🇸</span></h3>
            <p>Supporting justice, human rights, and the dignity of all people. Technology should empower
                communities and promote peace worldwide.</p>
        </div>
    </main>


    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postName = urlParams.get('post') || 'my-first-post';

        fetch(`./posts/${postName}.md`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Article not found');
                }
                return response.text();
            })
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(error => {
                document.getElementById('content').innerHTML =
                    '<h1>404</h1><p>Article not found.</p>';
            });
    </script>
</body>

</html>
